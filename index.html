<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora CLT 2026</title>

    <meta name="description" content="Calcule seu salário líquido conforme INSS e IRRF 2026.">
    <meta name="keywords" content="Calculadora CLT, INSS, IRRF, salário líquido">
    <meta name="author" content="Seu Nome">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- HEADER -->
<header class="header">
    <div class="logo">
        <i class="fa-solid fa-calculator"></i>
        <h1>Calculadora CLT</h1>
    </div>
</header>

<!-- MAIN -->
<main class="container">

    <!-- FORM -->
    <section class="card formulario">

        <h2>Informe seus dados</h2>

        <form id="formCalculo">

            <input type="number" id="salario" placeholder="Salário Bruto">

            <select id="dependentes">
                <option value="0">0 dependentes</option>
                <option value="1">1</option>
                <option value="2">2</option>
            </select>

            <input type="number" id="outros" value="0" placeholder="Outros descontos">

            <button type="submit">
                Calcular
            </button>

        </form>

    </section>

    <!-- RESULTADO -->
    <section class="card resultado">

        <h2>Resultado</h2>

        <h1 id="salarioLiquido">R$ 0,00</h1>

        <p>Bruto: <span id="salarioBrutoResultado">R$ 0,00</span></p>
        <p>INSS: <span id="valorInss">R$ 0,00</span></p>
        <p>IRRF: <span id="valorIrrf">R$ 0,00</span></p>
        <p>Total: <span id="valorTotal">R$ 0,00</span></p>

        <button id="btnPdf">PDF</button>

    </section>

</main>

<!-- FOOTER -->
<footer>
    <p>© 2026 Calculadora CLT</p>
</footer>

<!-- SCRIPTS CORRETOS (ÚNICO BLOCO) -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="js/utils.js"></script>
<script src="js/calculos.js"></script>
<script src="js/chart.js"></script>
<script src="js/pdf.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>

</body>
</html>
